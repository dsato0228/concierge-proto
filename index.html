<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AI Concierge</title>
<style>
  :root { --main:#1f3a5f; --accent:#e07a2e; --bg:#f6f4f0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Sans","Noto Sans CJK JP","Noto Sans TC","Noto Sans KR",sans-serif; background:var(--bg); color:#222; height:100vh; display:flex; flex-direction:column; }
  header { background:var(--main); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:20px; margin:0; flex:1; }
  .langs { display:flex; gap:6px; }
  .langs button { font-size:16px; padding:8px 12px; border-radius:8px; border:2px solid #fff; background:transparent; color:#fff; }
  .langs button.on { background:#fff; color:var(--main); font-weight:bold; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:12px 14px; border-radius:14px; font-size:20px; line-height:1.5; white-space:pre-wrap; }
  .me { align-self:flex-end; background:#dbe7f5; }
  .ai { align-self:flex-start; background:#fff; border:1px solid #ddd; }
  .meta { font-size:12px; color:#888; margin-top:4px; }
  .handoff { border-color:var(--accent); }
  footer { padding:12px 16px 16px; background:#fff; border-top:1px solid #ddd; }
  #talk { width:100%; font-size:24px; padding:20px; border:none; border-radius:16px; background:var(--accent); color:#fff; font-weight:bold; touch-action:none; user-select:none; -webkit-user-select:none; }
  #talk.rec { background:#c0392b; }
  #talk:disabled { background:#bbb; }
  form { display:flex; gap:8px; margin-top:10px; }
  #q { flex:1; font-size:20px; padding:12px; border:1px solid #bbb; border-radius:10px; }
  #send { font-size:20px; padding:0 18px; border:none; border-radius:10px; background:var(--main); color:#fff; }
  #status { font-size:14px; color:#666; margin-top:6px; min-height:1.2em; }
  .note { font-size:12px; color:#888; margin-top:4px; }
</style>
</head>
<body>
<header>
  <h1 id="title">AI Concierge</h1>
  <div class="langs">
    <button data-l="en">EN</button>
    <button data-l="zh-Hant">繁中</button>
    <button data-l="ko">한국어</button>
    <button data-l="ja">日本語</button>
  </div>
</header>
<div id="log"></div>
<footer>
  <button id="talk">🎤</button>
  <form id="f"><input id="q" autocomplete="off"><button id="send">➤</button></form>
  <div id="status"></div>
  <div class="note" id="note"></div>
</footer>
<script>
// ===== 設定 =====
// ?api=<Apps Script の URL>&room=<部屋ID>&k=<合言葉>&lang=<既定の言語>
// ?api=mock でページだけを試す（AI は呼ばない）
const P = new URLSearchParams(location.search);
const CFG = { api: P.get('api') || '', room: P.get('room') || '', k: P.get('k') || '' };
const T = {
  en: { title:'AI Concierge', talk:'🎤 Hold to talk', rec:'● Listening… release to send', ph:'Type your question', think:'Thinking…', voice:'Preparing voice…', note:'Audio is recorded only while you hold the button and is not saved. Questions and answers are kept as text.', mic:'Microphone not available. Please type instead.', err:'Sorry, something went wrong. Please try again or contact staff.', hello:'Hello! Ask me anything about your stay.' },
  'zh-Hant': { title:'AI 禮賓服務', talk:'🎤 按住說話', rec:'● 聆聽中…放開即送出', ph:'請輸入您的問題', think:'思考中…', voice:'準備語音中…', note:'僅在按住按鈕時錄音，錄音不會保存。問題與回答以文字保存。', mic:'無法使用麥克風，請改用文字輸入。', err:'抱歉，發生錯誤。請再試一次或聯絡工作人員。', hello:'您好！有任何住宿相關問題都可以問我。' },
  ko: { title:'AI 컨시어지', talk:'🎤 누르고 말하기', rec:'● 듣는 중… 손을 떼면 전송', ph:'질문을 입력하세요', think:'생각 중…', voice:'음성 준비 중…', note:'버튼을 누르는 동안만 녹음되며 녹음은 저장되지 않습니다. 질문과 답변은 텍스트로 보관됩니다.', mic:'마이크를 사용할 수 없습니다. 텍스트로 입력해 주세요.', err:'죄송합니다. 오류가 발생했습니다. 다시 시도하거나 직원에게 문의해 주세요.', hello:'안녕하세요! 숙박에 관해 무엇이든 물어보세요.' },
  ja: { title:'AIコンシェルジュ', talk:'🎤 押して話す', rec:'● 聞いています…離すと送信', ph:'質問を入力', think:'考えています…', voice:'音声を準備しています…', note:'ボタンを押している間だけ録音し、録音は保存しません。質問と回答は文字で記録します。', mic:'マイクが使えません。文字で入力してください。', err:'エラーが発生しました。もう一度お試しいただくか、スタッフへご連絡ください。', hello:'こんにちは。滞在について何でもお聞きください。' }
};
let lang = T[P.get('lang')] ? P.get('lang') : 'en';
const $ = id => document.getElementById(id);
const log = $('log'), talk = $('talk'), status = $('status');

function applyLang() {
  const t = T[lang];
  document.documentElement.lang = lang;
  $('title').textContent = t.title; talk.textContent = t.talk; $('q').placeholder = t.ph; $('note').textContent = t.note;
  document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
}
document.querySelectorAll('.langs button').forEach(b => b.onclick = () => { lang = b.dataset.l; applyLang(); });
applyLang();
add('ai', T[lang].hello);

function add(who, text, meta, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + who + (cls ? ' ' + cls : '');
  d.textContent = text;
  if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; d.appendChild(m); }
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

// ===== 通信（text/plain の POST＝事前確認の通信を起こさない） =====
async function call(body) {
  if (CFG.api === 'mock') return mock(body);
  const r = await fetch(CFG.api, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ room:CFG.room, k:CFG.k }, body)), redirect:'follow' });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'error');
  return j;
}
async function mock(body) {
  await new Promise(r => setTimeout(r, 600));
  if (body.op === 'ask') return { ok:true, lang, transcript: body.text || '(voice)', answer: '[mock] ' + (body.text || 'voice ' + Math.round((body.audio||'').length*0.75/1024) + 'KB'), handoff:false, ms:600 };
  // 0.6 秒の 440Hz を返す
  const rate = 24000, n = rate * 0.6, b = new Int16Array(n);
  for (let i = 0; i < n; i++) b[i] = Math.sin(2*Math.PI*440*i/rate) * 8000;
  return { ok:true, pcm: b64(new Uint8Array(b.buffer)), rate, ms:600 };
}

// ===== 質問 → 文字の回答 → （声で聞いたときは）読み上げ =====
let busy = false;
async function ask(payload, speak) {
  if (busy) return; busy = true; talk.disabled = true;
  const t0 = performance.now();
  status.textContent = T[lang].think;
  try {
    const a = await call(Object.assign({ op:'ask', lang }, payload));
    const t1 = performance.now();
    if (payload.audio) add('me', a.transcript || '🎤');
    add('ai', a.answer, `${((t1-t0)/1000).toFixed(1)}s`, a.handoff ? 'handoff' : '');
    if (speak) {
      status.textContent = T[lang].voice;
      const v = await call({ op:'tts', lang: a.lang || lang, text: a.answer });
      await playPcm(v.pcm, v.rate);
      const t2 = performance.now();
      log.lastChild.querySelector('.meta').textContent = `text ${((t1-t0)/1000).toFixed(1)}s / voice ${((t2-t0)/1000).toFixed(1)}s`;
    }
    status.textContent = '';
  } catch (e) {
    console.error(e); add('ai', T[lang].err, String(e.message || e)); status.textContent = '';
  } finally { busy = false; talk.disabled = false; }
}
$('f').onsubmit = ev => { ev.preventDefault(); const q = $('q').value.trim(); if (!q) return; $('q').value = ''; add('me', q); unlockAudio(); ask({ text:q }, false); };

// ===== 録音（押している間だけ・16kHz モノラル WAV に変換） =====
let ac, stream, src, proc, chunks = [], recRate = 48000, recording = false;
function unlockAudio() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); }
async function startRec(ev) {
  ev.preventDefault(); if (busy || recording) return;
  unlockAudio();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:true, noiseSuppression:true, channelCount:1 } });
  } catch (e) { status.textContent = T[lang].mic; return; }
  recording = true; chunks = []; recRate = ac.sampleRate;
  src = ac.createMediaStreamSource(stream);
  proc = ac.createScriptProcessor(4096, 1, 1);
  proc.onaudioprocess = e => { if (recording) chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
  src.connect(proc); proc.connect(ac.destination);
  talk.classList.add('rec'); talk.textContent = T[lang].rec;
}
function stopRec(ev) {
  if (ev) ev.preventDefault(); if (!recording) return;
  recording = false; talk.classList.remove('rec'); talk.textContent = T[lang].talk;
  proc.disconnect(); src.disconnect(); stream.getTracks().forEach(t => t.stop());
  const len = chunks.reduce((s, c) => s + c.length, 0);
  if (len < recRate * 0.4) return; // 0.4 秒未満は送らない
  const wav = toWav16k(chunks, len, recRate); chunks = [];
  ask({ audio: b64(wav) }, true);
}
talk.addEventListener('pointerdown', startRec);
talk.addEventListener('pointerup', stopRec);
talk.addEventListener('pointerleave', stopRec);
talk.addEventListener('pointercancel', stopRec);
talk.addEventListener('contextmenu', e => e.preventDefault());

function toWav16k(chunks, len, rate) {
  const all = new Float32Array(len); let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
  const out = 16000, ratio = rate / out, n = Math.floor(len / ratio);
  const buf = new ArrayBuffer(44 + n*2), v = new DataView(buf);
  const w = (p, s) => { for (let i = 0; i < s.length; i++) v.setUint8(p+i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4, 36+n*2, true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,out,true); v.setUint32(28,out*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
  for (let i = 0; i < n; i++) { // 区間平均で間引く
    const a = Math.floor(i*ratio), b = Math.min(len, Math.floor((i+1)*ratio)); let s = 0; for (let j = a; j < b; j++) s += all[j];
    const x = Math.max(-1, Math.min(1, s / Math.max(1, b-a))); v.setInt16(44+i*2, x < 0 ? x*0x8000 : x*0x7fff, true);
  }
  return new Uint8Array(buf);
}

// ===== 再生（WAV ヘッダ付きでも生の PCM でも再生） =====
async function playPcm(b64s, rate) {
  unlockAudio();
  let bytes = Uint8Array.from(atob(b64s), c => c.charCodeAt(0));
  if (bytes.length > 44 && String.fromCharCode(...bytes.slice(0,4)) === 'RIFF') {
    const dv = new DataView(bytes.buffer); rate = dv.getUint32(24, true) || rate;
    // data チャンクを探す
    let p = 12; while (p + 8 < bytes.length) { const id = String.fromCharCode(...bytes.slice(p,p+4)), sz = dv.getUint32(p+4, true); if (id === 'data') { bytes = bytes.slice(p+8, p+8+sz); break; } p += 8 + sz; }
  }
  const s = new Int16Array(bytes.buffer, bytes.byteOffset, Math.floor(bytes.byteLength/2));
  const ab = ac.createBuffer(1, s.length, rate || 24000), ch = ab.getChannelData(0);
  for (let i = 0; i < s.length; i++) ch[i] = s[i] / 32768;
  const node = ac.createBufferSource(); node.buffer = ab; node.connect(ac.destination);
  await new Promise(r => { node.onended = r; node.start(); });
}
function b64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000)); return btoa(s); }
</script>
</body>
</html>
